<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDUCA — Exploits, Héros & Légendes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #080810;
    font-family: 'Rajdhani', sans-serif;
    padding: 40px;
  }

  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    text-align: center;
    margin: 48px 0 24px;
    position: relative;
  }
  .section-title::before, .section-title::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 80px;
    height: 0.5px;
  }
  .section-title::before { right: calc(50% + 100px); }
  .section-title::after  { left:  calc(50% + 100px); }

  .title-commun  { color: rgba(160,100,255,0.7); }
  .title-commun::before, .title-commun::after { background: rgba(160,100,255,0.3); }
  .title-rare    { color: rgba(26,223,204,0.8); }
  .title-rare::before, .title-rare::after { background: rgba(26,223,204,0.3); }
  .title-epic    { color: rgba(255,184,48,0.9); }
  .title-epic::before, .title-epic::after { background: rgba(255,184,48,0.35); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 200px);
    gap: 28px;
    justify-content: center;
  }

  .card {
    width: 200px;
    height: 280px;
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover {
    transform: translateY(-10px) rotate(-1deg) scale(1.04);
    z-index: 10;
  }

  /* COMMUN — purple */
  .commun {
    background: linear-gradient(160deg, #0e060f 0%, #1a0d1e 60%, #0e060f 100%);
    border: 1.5px solid #7030b0;
  }
  .commun .card-glow { box-shadow: inset 0 0 50px rgba(112,48,176,0.22); }
  .commun .cat-tag   { background: rgba(112,48,176,0.3); color: #b87aff; border: 0.5px solid rgba(112,48,176,0.5); }
  .commun .corner-tl, .commun .corner-br { border-color: rgba(160,96,255,0.5); }
  .commun .divider   { background: #7030b0; }
  .commun .dot-on    { background: #a060ff; }
  .clr-commun        { color: #a060ff; }

  /* RARE — teal */
  .rare {
    background: linear-gradient(160deg, #060f0e 0%, #0a1e1c 60%, #060f0e 100%);
    border: 1.5px solid #0f7a6a;
  }
  .rare .card-glow { box-shadow: inset 0 0 50px rgba(15,122,106,0.25); }
  .rare .cat-tag   { background: rgba(15,122,106,0.3); color: #4addc8; border: 0.5px solid rgba(15,122,106,0.5); }
  .rare .corner-tl, .rare .corner-br { border-color: rgba(26,223,204,0.5); }
  .rare .divider   { background: #0f7a6a; }
  .rare .dot-on    { background: #1adfcc; }
  .clr-rare        { color: #1adfcc; }

  /* EPIC — amber/gold */
  .epic {
    background: linear-gradient(160deg, #0f0a02 0%, #1e1408 60%, #0f0a02 100%);
    border: 1.5px solid #c07800;
  }
  .epic .card-glow { box-shadow: inset 0 0 60px rgba(192,120,0,0.28); }
  .epic .cat-tag   { background: rgba(192,120,0,0.3); color: #ffcc5a; border: 0.5px solid rgba(192,120,0,0.5); }
  .epic .corner-tl, .epic .corner-br { border-color: rgba(255,184,48,0.6); }
  .epic .divider   { background: #c07800; }
  .epic .dot-on    { background: #ffb830; }
  .clr-epic        { color: #ffb830; }

  .card-glow, .corner-tl, .corner-br { position: absolute; pointer-events: none; }
  .card-glow { inset: 0; border-radius: inherit; }
  .corner-tl { top: 6px; left: 6px; width: 14px; height: 14px;
    border-top: 1.5px solid; border-left: 1.5px solid; border-radius: 4px 0 0 0; }
  .corner-br { bottom: 6px; right: 6px; width: 14px; height: 14px;
    border-bottom: 1.5px solid; border-right: 1.5px solid; border-radius: 0 0 4px 0; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px 0;
  }
  .cat-tag {
    font-family: 'Orbitron', monospace;
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .card-num {
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.25);
  }

  .art-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .art-svg { width: 140px; height: 130px; }
  .art-placeholder {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: rgba(255,255,255,0.12);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    font-family: 'Orbitron', monospace;
  }

  .divider { height: 0.5px; margin: 0 12px; opacity: 0.3; }

  .card-bottom { padding: 8px 12px 10px; }
  .card-name {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.03em;
    line-height: 1.2;
  }
  .card-desc {
    font-size: 10px;
    font-weight: 500;
    color: rgba(255,255,255,0.38);
    margin-top: 3px;
    letter-spacing: 0.03em;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 7px;
  }
  .rarity { display: flex; gap: 4px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-off { background: rgba(255,255,255,0.12); }
  .xp-badge {
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.28);
  }
  .xp-badge span { color: rgba(255,255,255,0.65); }
  .pwr-badge {
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    font-weight: 700;
    color: rgba(255,255,255,0.25);
  }

  .epic .card-name { text-shadow: 0 0 14px rgba(255,184,48,0.45); }
  .rare .card-name  { text-shadow: 0 0 14px rgba(26,223,204,0.35); }
  .commun .card-name{ text-shadow: 0 0 14px rgba(160,96,255,0.35); }

  .epic:hover   { box-shadow: 0 0 30px rgba(255,184,48,0.3), 0 20px 40px rgba(0,0,0,0.5); }
  .rare:hover   { box-shadow: 0 0 30px rgba(26,223,204,0.25), 0 20px 40px rgba(0,0,0,0.5); }
  .commun:hover { box-shadow: 0 0 30px rgba(160,96,255,0.25), 0 20px 40px rgba(0,0,0,0.5); }

  .print-btn {
    display: block; margin: 48px auto 20px; padding: 12px 32px;
    background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.45); font-family: 'Orbitron', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    cursor: pointer; border-radius: 4px; transition: all 0.2s;
  }
  .print-btn:hover { border-color: rgba(255,255,255,0.5); color: rgba(255,255,255,0.8); }

  @media print {
    body { background: #080810; padding: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .grid { gap: 16px; }
    .print-btn, .section-title { break-inside: avoid; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="section-title title-commun">Exploits — Peu commun</div>
<div class="grid" id="grid-exploits"></div>

<div class="section-title title-rare">Héros — Rare</div>
<div class="grid" id="grid-heros"></div>

<div class="section-title title-epic">Légende — Épique &amp; Légendaire</div>
<div class="grid" id="grid-legendes"></div>

<button class="print-btn" onclick="window.print()">Imprimer les cartes</button>

function svgLegend1(c) {

function starPts(cx, cy, r1, r2) {
  let pts = [];
  for(let i=0;i<10;i++){
    const a = (i/10)*Math.PI*2 - Math.PI/2;
    const r = i%2===0 ? r1 : r2;
    pts.push(`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`);
  }
  return pts.join(' ');
}

const heros = [
  { id:'H01', tier:'rare', name:'Lecteur Rapide',  desc:'Terminé en moins de 60s', xp:'+350', pwr:280, dots:2, svg: c => svgRare1(c) },
  { id:'H02', tier:'rare', name:'Sans Faute',       desc:'Précision absolue 100%',  xp:'+400', pwr:320, dots:2, svg: c => svgRare2(c) },
  { id:'H03', tier:'rare', name:'Persévérant',      desc:'Recommencé après erreur', xp:'+300', pwr:260, dots:2, svg: c => svgRare3(c) },
];

const legendes = [
  { id:'L01', tier:'epic', name:"Maître de l'Alphabet", desc:'26 lettres maîtrisées',    xp:'+1000', pwr:850, dots:3, svg: c => svgLegend1(c) },
  { id:'L02', tier:'epic', name:'Constructeur',          desc:"10 mots d'affilée",        xp:'+800',  pwr:750, dots:3, svg: c => svgLegend2(c) },
  { id:'L03', tier:'epic', name:'Compagnon Légendaire',  desc:'Compagnon au niveau max',  xp:'+900',  pwr:800, dots:3, svg: c => svgLegend3(c) },
  { id:'L04', tier:'epic', name:'Sauveur',               desc:'Mission EDUCA accomplie',  xp:'+1500', pwr:999, dots:3, svg: c => svgLegend4(c) },
];

const CLR   = { commun: '#a060ff', rare: '#1adfcc', epic: '#ffb830' };
const LABEL = { commun: 'Exploit', rare: 'Héros',   epic: 'Légende' };

function buildCard(d) {
  const c = CLR[d.tier];
  const activeDots = Array.from({length:3},(_,i)=>
    `<div class="dot ${i < d.dots ? 'dot-on' : 'dot-off'}"></div>`
  ).join('');
  return `<div class="card ${d.tier}">
    <div class="card-glow"></div><div class="corner-tl"></div><div class="corner-br"></div>
    <div class="card-top"><div class="cat-tag">${LABEL[d.tier]}</div><div class="card-num">${d.id}</div></div>
    <div class="art-zone">${d.svg(c)}</div>
    <div class="divider"></div>
    <div class="card-bottom">
      <div class="card-name">${d.name}</div>
      <div class="card-desc">${d.desc}</div>
      <div class="card-footer">
        <div class="rarity">${activeDots}</div>
        <div class="pwr-badge">PWR <span style="color:rgba(255,255,255,0.55)">${d.pwr}</span></div>
        <div class="xp-badge">XP <span>${d.xp}</span></div>
      </div>
    </div>
  </div>`;
}

document.getElementById('grid-exploits').innerHTML = exploits.map(buildCard).join('');
document.getElementById('grid-heros').innerHTML    = heros.map(buildCard).join('');
document.getElementById('grid-legendes').innerHTML = legendes.map(buildCard).join('');
</script>
</body>
</html>
